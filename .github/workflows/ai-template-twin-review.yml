name: AI Template Twin Review
on:
  pull_request:
    paths:
      - 'governance/message-schemas/**'
      - '.github/workflows/ai-template-twin-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate review JSON schema and metadata twin
        run: |
          python -m pip install jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root=Path("governance/message-schemas")
          schema=json.loads((root/"schemas/ai-native-issue-send-gate.review.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          twin=json.loads((root/"controls/customer-communications-twin.review.json").read_text())
          assert twin["source"]["contains_business_records"] is False
          assert twin["deployment"]["production_authorised"] is False
          assert twin["source"]["completeness"] == "partial"
          print("PASS: schema valid; twin marked partial and production denied")
          PY
      - name: Simulate digital twin fail-closed
        run: python governance/message-schemas/controls/simulate_twin.py
      - name: Test digital twin and governed release preflight
        run: |
          python -m unittest discover -s governance/message-schemas/tests -p 'test_twin_simulation.py' -v
          python governance/message-schemas/tests/test_release_gate_preflight.py
          python -m unittest discover -s governance/message-schemas/tests -p 'test_deluge_issue_preflight_contract.py' -v
          python -m unittest discover -s governance/message-schemas/tests -p 'test_exact_instance_review.py' -v

name: Access control terms acceptance
on:
  pull_request:
    paths: ['governance/**', '.github/workflows/access-control-tests.yml']
  push:
    branches: [main]
    paths: ['governance/**', '.github/workflows/access-control-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test governance/tests/*.test.js

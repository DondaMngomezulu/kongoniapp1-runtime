name: Enterprise Writing candidate schema validation
on:
  push:
    paths:
      - 'governance/enterprise-writing/**'
      - '.github/workflows/enterprise-writing-schema-tests.yml'
  pull_request:
    paths:
      - 'governance/enterprise-writing/**'
      - '.github/workflows/enterprise-writing-schema-tests.yml'
jobs:
  schema-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install -r governance/enterprise-writing/requirements-test.txt
      - name: Validate one-to-one mappings and 18 profiles
        run: cd governance/enterprise-writing && python -m unittest discover -s tests -v

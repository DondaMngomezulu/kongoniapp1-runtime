name: Full 101-Type UBL XSLT Projection Static Regression
on:
  pull_request:
    paths:
      - 'governance/message-schemas/ubl25-html-projections/**'
      - '.github/workflows/ubl25-full-projection-regression.yml'
  push:
    branches: [main]
    paths:
      - 'governance/message-schemas/ubl25-html-projections/**'
      - '.github/workflows/ubl25-full-projection-regression.yml'
jobs:
  projections:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'lxml>=5,<7'
      - run: python -m unittest discover -s governance/message-schemas/ubl25-html-projections/templates/full/tests -p 'test_*.py' -v

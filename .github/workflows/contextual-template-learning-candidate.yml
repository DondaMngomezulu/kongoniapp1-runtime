name: Contextual Template Learning Candidate Checks

on:
  pull_request:
    paths:
      - 'governance/message-schemas/ml/**'
      - '.github/workflows/contextual-template-learning-candidate.yml'

permissions:
  contents: read

jobs:
  review-only-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema checker
        run: python -m pip install jsonschema==4.26.0
      - name: Run synthetic candidate tests
        run: python -m unittest discover -s governance/message-schemas/ml/tests -v
      - name: Validate candidate JSON Schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('governance/message-schemas/ml/schemas')
          files = sorted(root.glob('*.schema.json'))
          assert len(files) == 3, f"Expected 3 candidate schemas, got {len(files)}"
          for path in files:
              Draft202012Validator.check_schema(json.loads(path.read_text()))
              print('PASS:', path)
          PY

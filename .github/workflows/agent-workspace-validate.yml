name: Agent Workspace Validation

on:
  push:
    paths:
      - 'agent-workspace/**'
      - '.github/workflows/agent-workspace-validate.yml'
  pull_request:
    paths:
      - 'agent-workspace/**'
      - '.github/workflows/agent-workspace-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - run: python agent-workspace/scripts/validate_workspace.py

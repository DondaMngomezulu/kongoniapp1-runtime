id: BR-OL-LCC-MAINT-RESERVE-001
title: Operating Lease LCC-Derived Maintenance Reserve Rule
version: 1.0.0
status: ADAPTED_FOR_REVIEW
control_class: BUSINESS_RULE
pdca_method: MET-PDCA-001
owner_value_stream: VS04
consumer_value_streams:
  - VS02
  - VS01
purpose: >-
  Ensure that every operating-lease maintenance reserve is derived from the
  machine-specific lifecycle cost model for the actual contractual term and
  governed utilisation basis, rather than from a flat percentage of acquisition cost.

normative_rule:
  statement: >-
    For any operating-lease Product Offering, Equipment Schedule, Quote, underwriting
    case or funding case, Maintenance Reserve SHALL equal the expected maintenance and
    lifecycle cash flows generated by the approved machine-specific LCC model over the
    applicable contract horizon. A percentage-of-asset-cost reserve MAY be retained only
    as a non-authoritative benchmark or early-stage proxy and SHALL NOT support final
    pricing, credit approval, DSCR, CFADS, Product Offering Price or submission approval.
  expression: >-
    maintenance_reserve_total = SUM(lcc_cash_flow_i for all in-scope lifecycle events i
    where event_time <= contract_end and event is allocated to lessor/service economics)
  rate_expression: >-
    maintenance_reserve_rate_per_smr_hour = maintenance_reserve_total / governed_expected_smr_hours
  monthly_expression: >-
    maintenance_reserve_monthly = term_specific_lcc_cash_flow_for_month

required_inputs:
  - machine_product_id
  - machine_model_or_asset_class
  - lcc_model_id
  - lcc_model_version
  - contract_term_months
  - governed_expected_smr_hours
  - service_scope
  - operating_environment
  - maintenance_strategy
  - component_life_assumptions
  - unit_cost_sources
  - labour_rate_sources
  - lubrication_and_fluid_cost_sources
  - evidence_refs

required_lcc_components:
  - Planned Maintenance Consumption
  - Planned Maintenance Labour
  - Corrective Repair
  - Lifecycle Component Replacement
  - Lubricants & Service Fluids
  - Running Gear & Undercarriage
  - Ground Engaging Tools
  - Wear Parts & Consumables
  - Field Maintenance Support
  - Technical Support
  - Condition Monitoring & Intervention

allocation_controls:
  no_double_recovery: true
  fixed_variable_overlap_prohibited: true
  diesel_excluded_unless_product_specification_explicitly_allocates_otherwise: true
  service_and_lease_components_separately_identifiable: true
  percentage_proxy_authoritative: false
  reserve_must_be_term_specific: true
  reserve_must_be_machine_specific: true
  reserve_must_be_versioned: true

term_controls:
  rule: >-
    A 36-month reserve SHALL be calculated over the 36-month/expected-hour horizon and a
    54-month reserve SHALL be calculated independently over the 54-month/expected-hour
    horizon. The 36-month reserve SHALL NOT be scaled linearly to 54 months where event
    timing, component replacements, rebuilds or utilisation-dependent costs differ.
  zizwe_reference_hours:
    option_b_36_months_at_240h: 8640
    option_a_54_months_at_240h: 12960

finco_consumption:
  rule: >-
    FinCo SHALL consume the LCC-derived maintenance reserve as a priority economic input
    before CFADS, DSCR, debt sizing, pricing return and sponsor/equity return are approved.
  prohibited: >-
    FinCo SHALL NOT independently substitute a percentage-of-asset-cost maintenance
    reserve after an approved LCC-derived reserve exists.

quote_gate:
  condition: >-
    An Operating Lease Quote or Product Offering Price SHALL NOT become APPROVED,
    ISSUED or SUBMITTED where a mandatory maintenance reserve is sourced only from a
    flat percentage proxy or where the applicable LCC model is incomplete for the quoted term.
  fail_closed: true

source_evidence:
  - source: KON-KE-OLP-POL-001 Operating Lease Structuring and Investment Policy
    support: >-
      Total lease and service consideration must recover preventive/corrective maintenance,
      tyres, strategic spares, major components, rebuilds and required lifecycle reserves.
  - source: VMG-AIM-FCT-001 Maintenance Demand Register
    support: >-
      Contains machine-maintenance tasks, intervals, occurrences, lifetime cost and cost per
      operating hour used as LCC evidence.
  - source: Zizwe Khutala Option A/B Commercial Proposal v0.3
    support: >-
      Records the legacy 15 percent reserve as a placeholder and identifies the bottom-up
      AssetCo L5 method as the required basis.

legacy_rule_disposition:
  legacy_maintenance_reserve_percent: 0.15
  status: SUPERSEDED_FOR_FINAL_UNDERWRITING
  permitted_use:
    - regression_comparator
    - early_stage_sensitivity
  prohibited_use:
    - final_customer_price
    - final_dscr
    - final_cfads
    - credit_approval
    - tender_submission
    - product_offering_price_approval

validation:
  pass_if:
    - lcc_model_id is not null
    - lcc_model_version is not null
    - maintenance_reserve_total is not null
    - governed_expected_smr_hours > 0
    - evidence_refs is not empty
    - no_double_recovery == true
  act_on_failure: ADAPT

record_requirements:
  - lcc_model_id
  - lcc_model_version
  - reserve_total
  - reserve_rate_per_smr_hour
  - reserve_cash_flow_schedule
  - contract_term_months
  - expected_smr_hours
  - source_evidence_refs
  - check_result
  - act_decision

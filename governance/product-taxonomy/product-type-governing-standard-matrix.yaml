  product_domain: Equipment Provision
  product_family: Equipment Sales
  primary_governing_standard: IDTA AAS 02003
  canonical_standard_concept: Product type / equipment technical specification
  secondary_semantic_reference: TM Forum ProductSpecification; MIMOSA CCOM
  product_specification_profile: Equipment Product Specification
  required_authoritative_source: OEM catalogue; OEM technical data sheet
  applicable_agreement_type: Sale of Equipment Agreement

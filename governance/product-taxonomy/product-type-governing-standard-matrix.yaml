id: MAT-PRD-TYPE-STD-001
name: Product Type to Governing Standard Matrix
version: 1.0.0
status: ADOPTED
effective_date: '2026-08-19'
governance_method: MET-PDCA-001
parent_controls:
- CTL-PRD-REF-LIB-001
- CTL-PRD-TAX-001
- MAT-PRD-ARTIFACT-001
rule: Every L3 Product Type SHALL identify its governing standard, canonical standard concept, secondary semantic reference, Product Specification profile, authoritative source content, and applicable agreement type. L4-L6 SHALL inherit the L3 provenance unless a governed subtype adds stricter requirements.
coverage:
  l3_product_types: 29
  source: Zoho CRM ProductTaxonomy readback 2026-08-19
records:

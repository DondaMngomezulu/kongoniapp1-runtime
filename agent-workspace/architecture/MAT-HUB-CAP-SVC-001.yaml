  - HUB-GAP-007
  - HUB-GAP-004
  - HUB-GAP-005
  - HUB-GAP-009
  - HUB-GAP-010
check_study_result: PASS_WITH_MATERIAL_HUB_SERVICE_GAPS
act_recommendation: ADAPT
closure_rule: DO_COMPLETE != TASK_COMPLETE

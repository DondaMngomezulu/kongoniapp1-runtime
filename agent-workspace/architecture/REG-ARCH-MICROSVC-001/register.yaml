coverage_gaps:
  - value_stream_id: VS00
    gap: Complete VS00 Service Domain catalogue has not yet been normalized into a single governed Service Domain source for register generation.
    status: SOURCE_CATALOGUE_GAP
  - value_stream_id: VS01
    gap: Non-BIAN Asset Provision and Access Service Domains require assurance against adopted OEM/APQC/TM Forum sources before full register coverage.
    status: SOURCE_CATALOGUE_GAP
  - value_stream_id: VS02
    gap: BIAN Operating Lease domains are represented; other finance products and capital-provision Service Domains require separate catalogue assurance.
    status: SOURCE_CATALOGUE_GAP
  - value_stream_id: VS03
    gap: BIAN risk/recovery domains are represented for Operating Lease; insurance and broader risk Service Domains require catalogue assurance.
    status: SOURCE_CATALOGUE_GAP
  - value_stream_id: VS04
    gap: MIMOSA CCOM is codified as schema objects, not yet as a normalized Service Domain catalogue suitable for automatic microservice generation.
    status: SOURCE_CATALOGUE_GAP
  - value_stream_id: VS05
    gap: Asset Securitization is represented; full investment and portfolio Service Domain catalogue requires assurance.
    status: SOURCE_CATALOGUE_GAP
  - value_stream_id: VS06
    gap: GMG/mining production reference content is not yet normalized into the governed Service Domain structure required by this register.
    status: SOURCE_CATALOGUE_GAP

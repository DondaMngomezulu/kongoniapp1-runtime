previous_microservice_name: Operating Lease Legal Compliance Service
new_microservice_name: Legal and Compliance Service
service_domain_name: Legal Compliance
reference_standard: BIAN
reference_version: '14.0.0'
value_stream_id: VS02
value_stream_name: Asset Finance & Capital Provision
scope_effect:
  - Canonical microservice name is broadened from an Operating-Lease-specific label to Legal and Compliance Service.
  - Existing BIAN Legal Compliance service-domain binding is retained.
  - Existing microservice identifier is retained.
  - Existing service boundary remains authoritative until the service specification is adapted.

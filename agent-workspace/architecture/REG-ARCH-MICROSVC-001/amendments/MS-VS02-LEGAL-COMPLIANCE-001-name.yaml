  requested_by: Group CEO
consolidation_rule: >-
  On adoption, replace the microservice_name for MS-VS02-LEGAL-COMPLIANCE-001 in register.yaml with
  'Legal and Compliance Service'. Do not change service_domain_name, source_domain_id, or microservice_id
  unless a separate architecture decision authorises that change.

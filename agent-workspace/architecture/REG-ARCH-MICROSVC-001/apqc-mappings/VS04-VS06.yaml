regression_test:
  test_basis:
    - single_coherent_business_responsibility
    - common_canonical_resource_or_state
    - common_owner
    - shared_transaction_boundary
    - shared_scaling_and_security_profile
    - APQC_L3_L5_cohesion
  result:
    VS04: PASS_WITH_GAPS
    VS06: PASS_WITH_SECTOR_SOURCE_GAP
  findings:
    - VS04 maintenance planning, execution, and completion remain distinct but cohesive service boundaries.
    - Measurement/condition and health/prognostics overlap at APQC 10.3.1.2, but MIMOSA semantics justify separate candidate boundaries pending engineering-level load and ownership tests.
    - VS06 GMG-derived service boundaries remain cohesive; APQC Cross-Industry supports operations but does not define mining-specific boundaries.
    - Exact APQC Upstream Petroleum L3-L5 mapping cannot be asserted until the profile hierarchy is ingested into the governed catalogue.

act_recommendation: ADAPT
next_action: Ingest the exact APQC Upstream Petroleum 7.2.2 hierarchy under applicable licence terms, then rerun VS06 L3-L5 mapping and boundary regression.

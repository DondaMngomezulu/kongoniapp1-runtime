artifact_id: MAP-ARCH-APQC-VS04-VS06-001
version: '0.1'
status: DRAFT
purpose: Map VS04 and VS06 Service Domains to APQC L3-L5 process references without treating APQC process elements as automatic microservice boundaries.

mapping_rule: >-
  Service Domain remains the candidate microservice boundary. APQC L3-L5 is used as process decomposition,
  completeness evidence, operation discovery, and handover traceability. An APQC element SHALL NOT become a
  microservice solely because it exists at L3, L4, or L5.

source_controls:
  governed_catalogue: Catalyst APQC_ProcessElementReference
  capability_crosswalk: Catalyst CapabilityAPQCCrosswalk
  cross_industry_profile:
    name: APQC Cross-Industry PCF
    version: '8.0'
    status: ACTIVE_REFERENCE
  sector_profile_vs06:
    name: APQC Upstream Petroleum PCF
    version: '7.2.2'
    status: SECTOR_REFERENCE_SOURCE_INGESTION_REQUIRED
    applicability_note: >-
      APQC identifies this PCF with NAICS 21 Mining, Quarrying, and Oil and Gas Extraction, but the framework is
      specialized for upstream petroleum. It is therefore a supporting sector comparator for VS06 and does not
      override GMG mining semantics.


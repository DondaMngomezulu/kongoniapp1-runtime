artifact:
  id: REG-ARCH-MICROSVC-001
  name: Enterprise Microservice Register
  version: '0.3'
  status: APPROVED_CONTROLLED_ADOPTION
  artifact_class: ARCHITECTURE_REGISTER
  owner_skill: SKL-GH-MICROSVC-ARCH-001
  engineering_consumer_skill: SKL-CAT-MICROSVC-ENG-001
  methodology: MET-PDCA-001
  purpose: >-
    Govern the enterprise microservice landscape across all Value Streams and provide
    sufficient architecture information for controlled engineering handover.

canonical_handover_rule: >-
  A microservice SHALL NOT enter engineering unless its register entry is architecture-complete
  and references an approved Service Specification. Engineering SHALL implement the approved
  architecture and SHALL return material design defects to the Microservice Architect.

process_decomposition_rule: >-
  APQC is the primary process spine. For business microservices, APQC Level 3 is the default
  candidate boundary, Level 4 is the default candidate service-operation layer, and Level 5 is
  the default candidate executable task/workflow layer. The Level 3 candidate SHALL pass a
  bounded-context test covering outcome cohesion, state ownership, accountability, coupling,
  security, failure isolation, scaling, lifecycle, and independent deployment. A failed candidate
  MAY be merged with adjacent Level 3 processes or decomposed to Level 4/5 with recorded rationale.
  Service Domains and external frameworks provide semantic, information-model, API, and domain
  crosswalks and SHALL NOT automatically override the APQC process spine.

migration_control:
  baseline_register_version: '0.1'
  rule: >-
    Existing register entries created before schema version 0.3 remain valid legacy entries and
    SHALL be progressively enriched with service_class and APQC L3/L4/L5 fields when they are
    materially revised or prepared for engineering handover. The APQC-spine adoption SHALL NOT
    invalidate existing entries solely because migration fields are absent.
  new_or_materially_revised_entries: MUST_CONFORM_TO_V0_3_FIELDS
  legacy_entries: VALID_PENDING_CONTROLLED_ENRICHMENT
  regression_rule: No legacy entry may advance to engineering handover without satisfying the v0.3 completeness gate.

service_classes:
  - BUSINESS_PROCESS
  - DOMAIN_STATE_SERVICE
  - INTEGRATION_GATEWAY
  - PLATFORM_SERVICE

lifecycle_states:
  - IDENTIFIED
  - ARCHITECTED
  - AUTHORISED
  - BUILDING
  - DEVELOPMENT_DEPLOYED
  - VERIFIED
  - ADOPTED
  - PRODUCTION_DEPLOYED
  - ACTIVE
  - RETIRED

coverage_states:
  - VERIFIED_SOURCE
  - PROPOSED_MAPPING
  - SOURCE_CATALOGUE_GAP
  - ARCHITECTURE_GAP
  - NOT_APPLICABLE

apqc_mapping_states:
  - VERIFIED
  - PROPOSED
  - PENDING
  - NOT_APPLICABLE
  - SECTOR_PROFILE_GAP

required_fields_for_new_or_materially_revised_entries:
  identity:
    - microservice_id
    - microservice_name
    - service_class
    - value_stream_id
    - value_stream_name
    - lifecycle_state
  process_spine:
    - apqc_mapping_status
    - apqc_profile
    - apqc_profile_version
    - apqc_level_3
    - apqc_level_4
    - apqc_level_5
    - apqc_mapping_basis
  architecture:
    - service_domain_name
    - reference_standard
    - reference_version
    - source_domain_id
    - service_boundary
    - canonical_business_object
    - service_owner
    - architecture_owner_skill
  contract_handover:
    - service_specification_id
    - service_specification_status
    - key_operations
    - api_intent
    - data_ownership
    - dependencies
    - security_class
    - nonfunctional_requirements
    - acceptance_criteria
    - engineering_handover_status
  implementation:
    - target_platform
    - catalyst_project
    - preferred_runtime
    - preferred_language
    - github_source_ref
    - catalyst_runtime_ref
    - development_status
    - production_status
  assurance:
    - source_provenance
    - mapping_basis
    - coverage_state
    - test_status
    - audit_status
    - pdca_stage
    - act_decision

architecture_completeness_gate:
  mandatory_before_engineering:
    - value_stream_id_resolved
    - service_class_resolved
    - apqc_applicability_resolved
    - applicable_apqc_l3_l4_l5_mapping_resolved_or_exception_approved
    - bounded_context_test_passed
    - service_boundary_resolved
    - canonical_business_object_resolved
    - reference_source_resolved
    - approved_service_specification_exists
    - key_operations_resolved
    - data_ownership_resolved
    - security_requirements_resolved
    - acceptance_criteria_resolved
  failure_action: BLOCK_HANDOVER_AND_RETURN_TO_ARCHITECT

apqc_profile_rules:
  - Prefer the most applicable current APQC industry-specific PCF when an industry profile exists.
  - Use the cross-industry PCF to close common-process gaps and to provide an enterprise comparison baseline.
  - Preserve the APQC process ID, title, level, profile name, and profile version for each mapping.
  - APQC Level 3 is the default candidate business microservice boundary; it is not an automatic deployable boundary.
  - APQC Level 4 normally maps to candidate service operations and Level 5 normally maps to executable tasks/workflow steps.
  - Domain-state, integration-gateway, and platform services may use exception classes but SHALL retain APQC linkage to the business processes they enable.
  - When more than one APQC sector profile is applicable, record the primary profile and any secondary profiles with mapping rationale.
  - When no suitable APQC industry-specific profile exists, mark SECTOR_PROFILE_GAP and use the cross-industry PCF only where the mapping is supportable.
  - Proposed APQC mappings require CHECK/STUDY before they can be marked VERIFIED.

semantic_reference_rules:
  - BIAN and TM Forum may provide service-domain, information-model, and API semantics crosswalked to the APQC spine.
  - MIMOSA remains applicable to asset-lifecycle information semantics where adopted.
  - GMG remains applicable to surface-mining domain semantics where adopted.
  - No external semantic framework SHALL silently replace the approved APQC process spine.

provenance_rules:
  - External reference facts SHALL retain source standard, version, source ID, and provenance.
  - Adopted Kongoni mappings SHALL be marked separately from external normative content.
  - Proposed mappings SHALL NOT be represented as approved architecture.
  - Missing Service Domain catalogues SHALL create explicit coverage gaps; they SHALL NOT be invented.

residual_migration_exception:
  exception_id: EXC-CAT-LCC-STRATUS-001
  table: LCC_ModelDatasetChunk
  row_count: 5
  disposition: RETAIN_PENDING_LOSSLESS_STRATUS_MIGRATION
  reason: The table stores compressed/base64 dataset payloads and therefore violates the preferred object-storage pattern, but it contains populated authoritative evidence. The exposed Catalyst toolset provides Stratus upload signatures and object-management operations but no direct governed object-upload action in the current connector. Destructive retirement is prohibited until payload reconstruction, upload, hash verification, read-back, binding update and rollback evidence are complete.
  required_close_conditions:
    - Reconstruct every dataset from the stored codec and chunks.
    - Verify reconstructed SHA-256 against Dataset_SHA256.
    - Upload each authoritative dataset object to a governed Stratus path.
    - Read back the object and re-verify SHA-256 and byte length.
    - Update the applicable relational binding/provenance record to reference the Stratus object.
    - Preserve migration evidence and rollback copy until ACT.
    - Retire LCC_ModelDatasetChunk only after zero-loss CHECK/STUDY passes.
cleanup_rule:
  - Empty does not mean redundant.
  - A populated table SHALL NOT be deleted merely to recover schema capacity.
  - A normalized relation SHALL be retained when it represents an independent entity, association, lifecycle, authority, integrity, security or evidence requirement.
  - New tables remain governed by STD-CAT-REL-SCHEMA-001 and require a demonstrated runtime persistence need.

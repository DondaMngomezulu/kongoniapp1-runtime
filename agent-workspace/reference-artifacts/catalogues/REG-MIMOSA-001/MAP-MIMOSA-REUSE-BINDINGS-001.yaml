artifact_id: MAP-MIMOSA-REUSE-BINDINGS-001
name: Reusable MIMOSA Concept Binding Map
version: 0.1.0
status: PROPOSED_CONTROLLED_MAPPING
effective_date: 2026-08-19
methodology: MET-PDCA-001
parent_register: REG-MIMOSA-CONCEPT-001
purpose: Bind existing governed VS04 and LCC/TCO mappings to canonical reusable MIMOSA concept IDs without altering native MIMOSA source-object names.
service_domain_bindings:
  KSD-VS04-ASSET-REGISTRY-001: [MIM-CPT-ASSET, MIM-CPT-ENTITY, MIM-CPT-CRITICALITY, MIM-CPT-ACTUAL-EVENT]
  KSD-VS04-ASSET-STRUCTURE-001: [MIM-CPT-BREAKDOWN-STRUCTURE, MIM-CPT-BREAKDOWN-STRUCTURE-TEMPLATE, MIM-CPT-ASSET-COMPONENT, MIM-CPT-ASSET-CONNECTION, MIM-CPT-FUNCTION]
  KSD-VS04-ENGINEERING-STUDY-001: [MIM-CPT-ENGINEERING-STUDY, MIM-CPT-STUDY-ENTRY, MIM-CPT-STUDY-ASSET, MIM-CPT-STUDY-MODEL, MIM-CPT-STUDY-SEGMENT]
  KSD-VS04-MEASUREMENT-CONDITION-001: [MIM-CPT-MEASUREMENT, MIM-CPT-DATA-QUALITY]
  KSD-VS04-HEALTH-PROGNOSTICS-001: [MIM-CPT-ASSESSMENT, MIM-CPT-EVIDENCE, MIM-CPT-AGENT-ASSESSMENT]
  KSD-VS04-WORK-REQUEST-001: [MIM-CPT-CALENDAR-WORK, MIM-CPT-ACTIVE-WORK, MIM-CPT-CYCLE]
  KSD-VS04-WORK-EXECUTION-001: [MIM-CPT-ACTIVE-WORK, MIM-CPT-AGENT-WORK, MIM-CPT-EVENT, MIM-CPT-EVIDENCE]
  KSD-VS04-WORK-HISTORY-001: [MIM-CPT-COMPLETED-WORK, MIM-CPT-EVENT, MIM-CPT-EVIDENCE, MIM-CPT-DOCUMENT-ASSET]
lcc_tco_bindings:
  MLT-001: [MIM-CPT-ENGINEERING-STUDY]
  MLT-002: [MIM-CPT-STUDY-ASSET]
  MLT-003: [MIM-CPT-STUDY-MODEL]
  MLT-004: [MIM-CPT-STUDY-SEGMENT]
  MLT-005: [MIM-CPT-ASSET]
  MLT-006: [MIM-CPT-ASSET, MIM-CPT-ENTITY]
  MLT-007: [MIM-CPT-ASSET-COMPONENT]
  MLT-008: [MIM-CPT-BREAKDOWN-STRUCTURE, MIM-CPT-BREAKDOWN-STRUCTURE-TEMPLATE]
  MLT-009: [MIM-CPT-MEASUREMENT]
  MLT-010: [MIM-CPT-DATA-QUALITY]
  MLT-011: [MIM-CPT-ASSESSMENT]
  MLT-012: [MIM-CPT-CALENDAR-WORK, MIM-CPT-CYCLE]
  MLT-013: [MIM-CPT-ACTIVE-WORK]
  MLT-014: [MIM-CPT-COMPLETED-WORK]
  MLT-015: [MIM-CPT-EVENT, MIM-CPT-ACTUAL-EVENT]
  MLT-016: [MIM-CPT-EVIDENCE]
  MLT-017: [MIM-CPT-DOCUMENT-ASSET]
known_native_concepts_not_yet_promoted:
  - CPBMeasurement
  - FFTMeasurement
  - CPBSetup
  - FFTSetup
rule: Existing mappings SHALL resolve reusable semantic identity through this binding map until their native artifacts are revised to carry concept IDs directly. Native MIMOSA names remain preserved as source provenance.
pdca:
  stage: DO_COMPLETE
  check_required: true
  regression_required: true
  act_decision: null

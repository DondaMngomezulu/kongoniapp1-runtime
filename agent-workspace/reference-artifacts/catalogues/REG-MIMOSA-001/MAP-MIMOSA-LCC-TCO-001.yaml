      Acquisition and ownership costs plus lifecycle operating and maintenance
      costs less residual-value recovery, subject to governed TCO scope.
engine_binding:
  engine_id: ENG-LCC-001
  required_native_inputs:
    - Asset or model identity
    - Configuration and component structure
    - Usage/utilisation evidence
    - Planned and completed maintenance information
    - Condition/reliability evidence where available
    - Lifecycle events and provenance
  required_economic_extensions:
    - Cost basis
    - Currency and exchange-rate basis
    - Labour and parts rates
    - Energy/fuel rates where applicable
    - Residual-value basis
  tco_additional_extensions:
    - Acquisition cost
    - Financing cost
    - Insurance cost
    - Tax cost
validation_rules:
  - id: VR-MLT-001
    rule: Every LCC/TCO study SHALL identify a MIMOSA-compatible study subject.
  - id: VR-MLT-002
    rule: Native MIMOSA concepts SHALL retain their MIMOSA semantic identity and SHALL NOT be renamed as financial concepts.
  - id: VR-MLT-003
    rule: Financial and economic fields not native to MIMOSA SHALL be marked as Kongoni extensions.
  - id: VR-MLT-004
    rule: Currency conversion SHALL create an economic view and SHALL NOT create a new machine or MIMOSA model variant.
  - id: VR-MLT-005
    rule: Physical configuration differences SHALL remain distinct from economic variants.
  - id: VR-MLT-006
    rule: LCC and TCO outputs SHALL retain traceability to source lifecycle evidence and economic assumptions.
  - id: VR-MLT-007
    rule: LCC/TCO SHALL NOT be treated as native MIMOSA Product Types.
  - id: VR-MLT-008
    rule: AssetCo commercial products MAY consume LCC/TCO study outputs but SHALL remain governed by the approved Product Taxonomy and Product Specification framework.
repository_roles:
  github: Authoritative semantic mapping, schemas, validation rules and engineering history
  catalyst: Executable structured lifecycle and LCC/TCO datasets
  zoho_crm: AssetCo commercial product and ProductSpecification bindings
  google_drive: Controlled source documents and provenance evidence
pdca:
  stage: DO_COMPLETE
  check_required: true
  regression_required: true
  act_decision: null

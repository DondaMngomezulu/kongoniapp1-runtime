artifact_id: MAP-MIMOSA-LCC-TCO-001
name: MIMOSA CCOM to Kongoni LCC and TCO Semantic Crosswalk
version: 0.1.0
status: PROPOSED_CONTROLLED_MAPPING
effective_date: 2026-08-19
methodology: MET-PDCA-001
task_class: T2
value_stream:
  id: VS04
  name: Asset Lifecycle Performance
source_authority:
  primary_standard: MIMOSA CCOM
  normative_baseline: 4.0.0
  structural_reference: 4.1.0-RC1
  structural_reference_status: NONNORMATIVE_REFERENCE
  governed_catalogue: REG-MIMOSA-001
  architecture_mapping: CAT-ARCH-SD-VS04-MIMOSA-001
principle: >-
  MIMOSA CCOM SHALL govern asset identity, model/configuration, asset structure,
  lifecycle events, maintenance work, condition, measurements, engineering-study
  structure and evidence. Kongoni SHALL own financial and economic extension
  concepts required for Life Cycle Cost and Total Cost of Ownership calculations.
  Kongoni economic concepts SHALL NOT be represented as native MIMOSA concepts.
study_types:
  - study_type_id: KNG-LCC-STUDY
    name: Life Cycle Cost Study
    parent_mimosa_concept: EngineeringStudy
    engine_id: ENG-LCC-001
    purpose: >-
      Evaluate lifecycle costs for an asset model, machine configuration or
      serialized asset over a defined operating and economic horizon.
  - study_type_id: KNG-TCO-STUDY
    name: Total Cost of Ownership Study
    parent_mimosa_concept: EngineeringStudy
    engine_id: ENG-LCC-001
    purpose: >-
      Evaluate total ownership economics by combining lifecycle operating,
      maintenance and component costs with acquisition, financing, taxes,
      insurance and residual-value economics where applicable.

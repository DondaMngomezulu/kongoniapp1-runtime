  secondary_classification: LIFECYCLE_STAGE
  reference_dimensions:
    - OEM
    - PRODUCT_FAMILY
    - ASSET_CLASS
    - GEOGRAPHY
    - CHANNEL
    - LEGAL_ENTITY
identity_model:
  canonical_item_key: ENTERPRISE_CATALOGUE_ITEM_ID
  rule: Each catalogue item SHALL have one canonical enterprise identity and may have multiple governed bindings.
authority_model:
  google_drive: CONTROLLED_HUMAN_READABLE_SOURCE_AND_EVIDENCE
  github: ENGINEERING_DEFINITION_SCHEMA_TRANSFORMATION_AND_RECONCILIATION
  catalyst_development: AUTHORITATIVE_STRUCTURED_CATALOGUE_DEVELOPMENT
  catalyst_production: AUTHORITATIVE_EXECUTABLE_CATALOGUE_AFTER_CONTROLLED_PROMOTION
  transactional_systems: DOWNSTREAM_QUALIFIED_PROJECTIONS
repository_codification:
  google_drive:
    structure: VALUE_STREAM/CATALOGUE_CLASS/CATALOGUE/CONTROLLED_ARTIFACTS
    lifecycle_stage_usage: METADATA_NOT_PRIMARY_FOLDER
  github:
    structure: agent-workspace/reference-artifacts/catalogues/VALUE_STREAM/CATALOGUE_ID
    required_artifacts:
      - manifest.yaml
      - schema
      - validation_rules
      - mappings
      - transformations
  catalyst:
    common_spine:
      - EnterpriseCatalogue
      - EnterpriseCatalogueItem
      - CatalogueValueStreamBinding
      - CatalogueLifecycleStageBinding
      - CatalogueSourceBinding
      - CatalogueProjectionBinding
    source_domain_tables: retained and bound to common spine
  crm:
    role: COMMERCIAL_PROJECTION
    rule: CRM product identity SHALL reference EnterpriseCatalogueItem and SHALL NOT become catalogue master
value_stream_catalogue_model:
  VS01:
    catalogue_classes:
      - EQUIPMENT_PRODUCT
      - ACCESS_PRODUCT
  VS02:
    catalogue_classes:
      - EQUIPMENT_FINANCE_PRODUCT
      - CAPITAL_PRODUCT
  VS03:
    catalogue_classes:
      - RISK_PROTECTION_PRODUCT
      - INSURANCE_PRODUCT
  VS04:
    catalogue_classes:
      - PARTS
      - SERVICE
      - MAINTENANCE
      - LIFECYCLE_SUPPORT
  VS05:
    catalogue_classes:
      - RESIDUAL_VALUE
      - DISPOSAL
      - REMARKETING
      - REDEPLOYMENT
source_catalogues:
  CAT-XCMG-DIG-001:
    role: OEM_SOURCE_CATALOGUE
    rule: Feeds value-stream catalogues through governed bindings; SHALL NOT define enterprise ownership hierarchy.
controls:
  - Value Stream SHALL be the primary ownership boundary for enterprise catalogues.
  - Lifecycle Stage SHALL be a controlled applicability binding, not the primary repository hierarchy.
  - OEM catalogues SHALL be treated as source-domain catalogues and bound to value-stream-owned enterprise catalogues.
  - Each governed catalogue item SHALL retain one canonical Enterprise Catalogue Item ID across repositories.
  - Drive SHALL retain controlled human-readable source and evidence.
  - GitHub SHALL retain engineering definitions, schemas, mappings and transformations.
  - Catalyst Development SHALL retain the authoritative structured development record.
  - Production promotion SHALL require CHECK/STUDY evidence and an explicit ACT decision.
  - CRM, Books and other applications SHALL consume qualified projections and SHALL NOT redefine catalogue identity.
check_study:
  result: ADAPT_IMPLEMENTATION_IN_PROGRESS
  open_gaps:
    - Catalyst common catalogue spine tables not yet confirmed as existing
    - Existing catalogues require migration/binding to value-stream hierarchy
    - Catalyst Production promotion remains blocked pending verification
act:
  decision: ADAPT
  next_priority:
    - codify common catalogue spine in Catalyst Development
    - bind existing catalogue families to owning value streams
    - preserve lifecycle stage as controlled binding dimension
    - bind CRM projections to canonical Enterprise Catalogue Item IDs
    - verify no duplicate authority is introduced

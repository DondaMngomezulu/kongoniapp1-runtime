service_specification:
  id: SRV-BIAN-LEGAL-COMPLIANCE-001
  version: '0.1'
  status: CONTROLLED_DRAFT
  name: Legal and Compliance Service
  microservice_id: MS-VS02-LEGAL-COMPLIANCE-001
  architecture_owner_skill: SKL-GH-MICROSVC-ARCH-001
  engineering_consumer_skill: SKL-CAT-MICROSVC-ENG-001
  value_stream_id: VS02
  value_stream_name: Asset Finance & Capital Provision
  business_owner: VS02
  task_class: T2
  purpose: >-
    Execute and evidence governed legal and compliance assessments for FinCo activities by combining
    a reusable legal/compliance workflow with controlled rule-engine execution, preserving source
    authority and producing traceable decision evidence.
  service_domain:
    standard: BIAN
    version: '14.0.0'
    name: Legal Compliance
    domain_id: urn:bian:14.0.0:service-domain:legal-compliance
    primary_resource: LegalComplianceAssessment
    key_operations: [Evaluate, Retrieve, Update, Request, Exchange]
  initial_use_cases:
    - Operating Lease product classification and legal/compliance assessment
    - Equipment Loan definition and legal/compliance assessment
    - Equipment Finance Lease definition and legal/compliance assessment
    - Equipment Rental definition and legal/compliance assessment
  workflow_binding:
    workflow_id: WF-LEGAL-RULE-COD-001
    workflow_name: Governed Legal Rule Codification & Reference Execution Workflow
    workflow_role: orchestrates source intake, rule classification, LegalRuleML codification, validation, reference execution, evidence, CHECK_STUDY, ACT and record publication
  engine_binding:
    engine_name: LegalRuleML Reference Rule Engine
    representation_standard: OASIS LegalRuleML 1.0
    execution_mode_current: REFERENCE_SIMULATION
    execution_mode_target: DEPLOYED_RUNTIME
    target_runtime: Zoho Catalyst Legal and Compliance Service
    rule_semantics: [obligation, permission, prohibition, constitutive_statement]
  source_precedence:
    - authoritative_law_or_regulation
    - executed_or_approved_authoritative_agreement_or_policy
    - governed_Kongoni_template_or_controlled_source
    - licensed_industry_reference_where_permitted
    - external_reference_standard
    - derived_LegalRuleML_representation
  runtime_constraints:
    platform: Zoho Catalyst
    project: Kongoniapp1
    project_id: '86824000000020001'
    environment_target: Development
    preferred_runtime: AppSail
    preferred_language: Python
    production_write_allowed: false
    interim_reference_execution: ChatGPT governed reference harness
  application_authority:
    legal_source_authority: authoritative legal/regulatory source or executed agreement
    rule_representation_authority: GitHub governed LegalRuleML package
    workflow_authority: GitHub WF-LEGAL-RULE-COD-001
    customer_commercial_state: Zoho CRM
    accounting_state: Zoho Books where applicable
    evidence_state: governed evidence repository / Catalyst target
  input_contract:
    required:
      - assessment_id
      - subject_type
      - subject_id
      - value_stream_id
      - use_case
      - authoritative_source_refs
      - requested_assessment_scope
      - rule_package_version
    optional:
      - party_refs
      - agreement_refs
      - product_refs
      - asset_refs
      - jurisdiction
      - effective_date
      - facts
  output_contract:
    required:
      - assessment_id
      - classification
      - findings
      - source_bindings
      - rule_bindings
      - exceptions
      - evidence_refs
      - execution_mode
      - pass_flag
      - rule_package_version
    prohibited:
      - unsupported_legal_conclusion
      - invented_obligation
      - invented_permission
  business_rules:
    - LegalRuleML SHALL NOT replace the authoritative source.
    - Every executable or derived rule SHALL retain source traceability.
    - Reference execution SHALL NOT be represented as deployed runtime execution.
    - Unresolved legal interpretation SHALL produce an exception or escalation, not an invented rule.
    - Licensed clause text SHALL NOT be reproduced unless authorised.
    - Same governed inputs and rule-package version SHALL produce reproducible deterministic assertions where the rule is deterministic.
  security_class: CONFIDENTIAL_CONTRACT_AND_COMPLIANCE
  security_design:
    authentication: mandatory
    authorisation: least privilege and value-stream role binding
    secrets: Catalyst secret management in target runtime; no secrets in GitHub artifacts
    privileged_content: legal privilege status must be explicit where applicable
    audit_writes: mandatory
  nfr_slo_profile:
    availability: Development baseline to be measured before Production adoption
    latency: no Production target adopted in v0.1
    determinism: required for deterministic rule evaluations
    traceability: every finding must resolve to source and rule version
    idempotency: required for assessment create/update writes using assessment_id plus rule_package_version
    resilience: failure must preserve prior authoritative records and emit an auditable error state
  dependencies:
    business: [Customer Agreement Service, Sales Product Agreement Service, Product Directory Service]
    standards: [BIAN 14.0.0 Legal Compliance, OASIS LegalRuleML 1.0, applicable law and regulation]
    workflow: [WF-LEGAL-RULE-COD-001]
    target_platform: [Zoho Catalyst, API Gateway, Datastore, Stratus or Filestore as approved]
  artifact_refs:
    architecture_description: architecture.yaml
    canonical_data_model: data-model.yaml
    api_contract: openapi.yaml
    test_specification: test-specification.yaml
    engineering_handover: handover.yaml
    workflow_ref: ../../../governance/legal-ruleml/WF-LEGAL-RULE-COD-001.yaml
    register_ref: ../../architecture/REG-ARCH-MICROSVC-001/register.yaml
    handover_profile_ref: ../../architecture/PRF-ARCH-MICROSVC-HO-001/profile.yaml
  reference_precedent:
    subject: Kiboko/Venduo Secured Term Facility
    role: structural and execution precedent only
    rule: transaction-specific legal rules SHALL NOT become generic service rules
  canary_scope:
    - {operation: Evaluate, method: POST, path: /v1/legal-compliance/assessments}
    - {operation: Retrieve, method: GET, path: /v1/legal-compliance/assessments/{assessment_id}}
    - {operation: Update, method: PUT, path: /v1/legal-compliance/assessments/{assessment_id}}
  acceptance_criteria:
    - source authority is explicit and versioned
    - LegalRuleML rule package is traceable to authoritative source
    - positive, negative and boundary reference scenarios are recorded
    - observed outputs reconcile to expected assertions
    - no reference simulation is labelled as deployed runtime
    - all writes produce audit evidence
    - unresolved legal interpretation is surfaced as exception or escalation
    - Catalyst engineering handover is blocked until mandatory profile fields pass
  engineering_rule: >-
    Engineer SHALL implement the approved architecture package and SHALL return material design defects
    to SKL-GH-MICROSVC-ARCH-001 as ADAPT rather than silently redesigning service boundaries, authority,
    rule semantics or evidence contracts.
  approval_state: CONTROLLED_DRAFT
  production_authority: NOT_GRANTED

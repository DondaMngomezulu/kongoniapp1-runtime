check_study:
  result: PASS_ON_STATUTORY_CLAUSE_ARCHITECTURE_WITH_CONTROLLED_GAPS
  material_findings:
    - "NCA applicability is not universal for bilateral corporate facilities; section 4 must be resolved first."
    - "FIC Item 11 can apply even where certain corporate credit is excluded from NCA application."
    - "Companies Act sections 44 and 45 must not be collapsed into one generic corporate-approval control."
    - "Share transfers require securities-register/instrument mechanics and STT controls."
    - "SPA completion must include a current Competition Act merger-control applicability test."
    - "Electronic execution requires an ECTA formality test rather than a blanket e-signature assumption."
  controlled_gaps:
    - "Approved operative South African clause wording is absent in all three templates."
    - "Collateral-specific common-law pledge, cession, perfection and enforcement opinions/precedents remain unresolved."
    - "No transaction instance has yet bound borrower, lender, target, collateral, MOI, shareholder agreement, turnover/assets, NCA thresholds, FIC status, merger thresholds, tax facts or approvals."
  recommended_act: ADAPT
  recommended_act_reason: >-
    Keep the legal architecture and source-binding model, but do not promote templates. Build the next layer as a
    transaction legal-applicability profile plus approved operative clause library, starting with the Kiboko-Venduo
    facility/share/security transaction as the controlled canary.

source_evidence:
  - id: EVD-SRC-NCA-S4
    proposition: >-
      NCA section 4 applies to arm's-length credit agreements with specified exclusions, including
      juristic-person and large-agreement exclusions; applicability must therefore be determined from
      consumer status, related entities, asset/turnover threshold, agreement size and arm's-length facts.
  - id: EVD-SRC-COACT-S50-S51
    proposition: >-
      A company must maintain a securities register; a transfer of certificated securities is entered
      only if evidenced by a proper instrument of transfer or effected by operation of law.
  - id: EVD-SRC-COACT-S45-2024
    proposition: >-
      Companies Amendment Act 16 of 2024 inserted section 45(2A), excluding financial assistance
      by a company to or for the benefit of its subsidiaries from section 45.
  - id: EVD-SRC-STT
    proposition: >-
      SARS states STT applies to listed and unlisted securities at 0.25%; unlisted transfers require
      notification to the issuer within 30 days and payment within two months from the end of the transfer month.
  - id: EVD-SRC-FIC-ITEM11
    proposition: >-
      FIC Schedule 1 Item 11 covers persons carrying on credit-provider business and specified credit
      business excluded from the NCA under section 4(1)(a) or (b).


control_id: CTL-APP-AUTH-BOUNDARY-001
version: "0.2"
status: CANDIDATE
rule: Each governed state dimension has one authoritative application; projections shall not become competing masters.
authority:
  zoho_catalyst:
    owns:
      - canonical_party_identity
      - domain_logic_not_natively_owned_elsewhere
      - orchestration
      - handover_lifecycle_state
      - cross_system_identity_mapping
      - governance_and_compliance_rule_execution
  zoho_crm:
    owns:
      - customer_relationship_state
      - prospect_and_deal_state
      - commercial_relationship_transactions
    gateway: CRM Commercial Gateway
  zoho_books:
    owns:
      - authoritative_accounting_ledger
      - accounting_transactions
      - invoice
      - payment
      - credit_note
      - financially_committed_sales_order
      - chart_of_accounts_execution
    gateway: Books Financial Gateway
  zoho_workdrive:
    target_owns:
      - governed_document_content_for_designated_document_classes
      - handover_package_files_for_designated_document_classes
      - controlled_evidence_files_for_designated_document_classes
    gateway: WorkDrive Document Gateway
    activation_condition: Controlled repository-authority migration and approval from existing approved repositories.
accounting_governance:
  normative_frameworks:
    - IFRS
    - SARS
  rule_owner: Governance and Compliance Microservice
  execution_system: Zoho Books
  principle: IFRS and SARS obligations, interpretations, controls and validation rules SHALL be codified as governed rules and controls. Zoho Books SHALL execute the authorised accounting treatment and remain the accounting system of record.
  catalyst_gl_tables:
    classification: projection_analytics_and_reconciliation
    authoritative_ledger: false
    permitted_uses:
      - consolidation
      - analytics
      - reconciliation
      - migration_support
      - provenance
    prohibited_use: competing_accounting_master
storage_rule:
  governed_documents_target: zoho_workdrive_for_designated_classes
  current_approved_content_authority: catalyst_stratus_until_migrated
  catalyst_stratus: application_objects_computational_artifacts_and_non_migrated_content
  duplicate_authoritative_document_copy: prohibited

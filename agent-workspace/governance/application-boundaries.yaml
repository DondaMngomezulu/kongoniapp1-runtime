control_id: CTL-APP-AUTH-BOUNDARY-001
version: "0.2"
status: REPEAT_VALIDATED_CANDIDATE
rule: Each governed state dimension has one authoritative application; projections shall not become competing masters.
current_authority_evidence:
  catalyst_structured_records: APPROVED_ACTIVE
  catalyst_stratus_enterprise_shared_content: APPROVED_ACTIVE
  catalyst_stratus_value_stream_object_repositories: APPROVED_ACTIVE
  source: EnterpriseRepositoryAuthority in Kongoniapp1 Development
target_authority:
  zoho_catalyst:
    owns:
      - canonical_party_identity
      - domain_logic_not_natively_owned_elsewhere
      - orchestration
      - handover_lifecycle_state
      - cross_system_identity_mapping
  zoho_crm:
    owns:
      - customer_relationship_state
      - prospect_and_deal_state
      - commercial_relationship_transactions
    gateway: CRM Commercial Gateway
  zoho_books:
    proposed_owns:
      - accounting_state
      - committed_financial_transactions
      - invoice
      - payment
      - credit_note
      - financially_committed_sales_order
    gateway: Books Financial Gateway
    open_control: Existing Catalyst gl_* tables SHALL be classified as authoritative ledger, projection, staging, analytics, or migration data before this ownership change is adopted.
  zoho_workdrive:
    proposed_owns:
      - governed_document_content
      - handover_package_files
      - controlled_evidence_files
    gateway: WorkDrive Document Gateway
    open_control: Current approved Stratus repository authorities SHALL be migrated or reclassified through governed repository-authority change before WorkDrive becomes authoritative.
storage_rule:
  target_governed_documents: zoho_workdrive
  current_governed_content_authority: catalyst_stratus
  catalyst_stratus_target_role: application_objects_non_governed_binary_storage_and_explicitly_approved_repository_exceptions
  duplicate_authoritative_document_copy: prohibited
migration_rule: Target authority statements do not revoke current approved repository authorities until CHECK/STUDY, ACT, and authoritative Catalyst records are updated.

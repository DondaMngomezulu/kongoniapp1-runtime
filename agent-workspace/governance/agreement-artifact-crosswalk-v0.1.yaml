crosswalk:
  - kongoni_object: CAT-SA-AGR-PREC-001.TermsAndConditions.NormativeEffect
    external_artifact: OASIS LegalRuleML deontic and statement constructs
    mapping: "OBLIGATION / PERMISSION / PROHIBITION / CONSTITUTIVE -> LegalRuleML representation where machine-readable rule treatment is justified"
    ownership: CAT-SA-AGR-PREC-001
    duplication_risk: LOW
  - kongoni_object: CAT-SA-AGR-PREC-001.SourceID_and_Provenance
    external_artifact: "LegalRuleML LegalSource + Association"
    mapping: "Authoritative source identifier remains external source of authority; LegalRuleML retains traceability"
    ownership: CAT-SA-AGR-PREC-001
    duplication_risk: LOW
  - kongoni_object: REG-AGR-TPL-001.ArtifactContract
    external_artifact: Accord Concerto/template model pattern
    mapping: "Typed template variables and constraints can implement the Artifact Contract"
    ownership: REG-AGR-TPL-001
    duplication_risk: LOW_IF_PROFILED
  - kongoni_object: REG-AGR-TPL-001.AgreementTemplate
    external_artifact: Accord template text/rendering package
    mapping: "Optional implementation profile below the governed Template ID; never a replacement registry"
    ownership: REG-AGR-TPL-001
    duplication_risk: MEDIUM_WITHOUT_CONTROL
  - kongoni_object: REG-AGR-TPL-001.PromotionValidation
    external_artifact: "Accord sample data + compile/render/unit tests"
    mapping: "Technical validation evidence supplements, but does not replace, source sufficiency and substantive legal validation"
    ownership: REG-AGR-TPL-001
    duplication_risk: LOW
  - kongoni_object: MET-PDCA-001.ExecutionEvidence
    external_artifact: Kongoni evidence/work-item/change-log/handoff schemas
    mapping: "Existing schemas remain the control envelope for clause and template promotion work"
    ownership: KONGONI_AGENT_WORKSPACE
    duplication_risk: NONE


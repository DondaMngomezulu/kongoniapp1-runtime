check_study:
  result: PASS_WITH_CONTROLLED_GAPS
  findings:
    - "The three artifact families are complementary rather than duplicative when kept within existing governance boundaries."
    - "OASIS LegalRuleML is the correct representation/conformance layer, not the legal source of clause substance."
    - "Accord provides a reusable implementation and testing pattern, but cannot promote a Kongoni Agreement Template by itself."
    - "Existing Kongoni schemas should be reused as the execution/evidence envelope."
    - "No new contract language, parallel catalogue, parallel register, or generic evidence framework is justified."

recommended_act:
  decision: ADAPT
  adopt:
    - "OASIS LegalRuleML 1.0 semantics and official schema family as the machine-readable normative-rule conformance source."
    - "Existing Kongoni work-item, evidence, change-log, and handoff schemas as the control envelope."
  adapt:
    - "Accord Cicero/Concerto template-model, variable-binding, render-test, and unit-test patterns below the Kongoni Artifact Contract and Template layers."
  build_only_if_needed:
    - "Thin Kongoni Agreement Clause Profile linking CAT source provenance, T&C normative effect, LegalRuleML rule IDs, REG template bindings, and technical test cases."
    - "Thin validator/orchestrator that checks source traceability, XSD conformance, template data validation, render tests, and evidence output."
  reject:
    - "Use of Accord template wording as South African legal authority."
    - "Any parallel Agreement Catalogue or Agreement Template Register."
    - "Any claim that technical template tests establish substantive legal validity."

next_gates:
  - "Validate existing Kongoni LegalRuleML artifacts against the official OASIS compact XSD family and record errors/conformance evidence."
  - "Define the thin Agreement Clause Profile only after schema reuse is confirmed against the first Bilateral Facility clause set."
  - "Run Bilateral Facility substantive crosswalk: CAT T&C + South African sources -> governed clause candidate -> LegalRuleML representation -> optional Accord-compatible technical tests."
  - "Run regression and final ACT before any template is marked usable for transactions."

